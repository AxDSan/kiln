[package]
name = "kiln-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
kiln-ir = { path = "../ir" }
kiln-backend = { path = "../backend" }
kiln-debug = { path = "../debug" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
