name: Documentation

# The reference pages are generated from the toolchain, so the site cannot be
# built without building the compiler first — that is the point: a command that
# no longer exists cannot survive in the docs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned: an unpinned mdBook eventually changes its output or its flags,
      # and the failure shows up as a broken site rather than a broken build.
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # sqlite3 and a MySQL client so `db`'s optional group is actually on
          # and its documented samples are actually compiled. Without them the
          # samples still pass — the library degrades to a stub — but they pass
          # without testing anything, which is how a MySQL-only break reached
          # the runner unnoticed. libmariadb-dev replaces the image's
          # libmysqlclient-dev; that is the client the port this exists for uses.
          sudo apt-get install -y clang pkg-config libsqlite3-dev libmariadb-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook --locked --version "$MDBOOK_VERSION"

      - name: Build the compiler
        run: cargo build --release

      - name: Generate the reference pages
        run: tools/gen-docs.sh

      - name: Check every documented sample compiles
        run: tools/check-docs.sh

      - name: Build the site
        run: |
          mdbook build docs-site
          # The landing page is the site root; the book is published under
          # /docs/. Assembled here rather than in the repo so neither half has
          # to know where the other ends up.
          mkdir -p _site
          cp -r docs-site/landing/. _site/
          cp -r docs-site/book _site/docs

      - name: Check the assembled site
        run: tools/check-site.sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
