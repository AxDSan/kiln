[package]
name = "kiln-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads the debug information an Kiln build emits: line tables, and the functions they belong to."

[dependencies]
# DWARF. `gimli` is a reader, not a debugger — it parses the line program and
# the unit headers and hands back rows. Everything above it is ours.
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
# ELF and PE, so the same code reads a Linux build and a Windows cross-build.
object = { version = "0.37", default-features = false, features = ["read", "std"] }
memmap2 = "0.9"
