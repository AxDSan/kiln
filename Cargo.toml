# Kiln Cargo workspace.
# ir (IR + text parser) -> backend (IR -> LLVM IR text) -> cli (kiln
# build/run), with debug (reads the debug information a build emits) beside
# them.
[workspace]
resolver = "2"
members = ["ir", "backend", "cli", "debug"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT OR BSD-3-Clause"
repository = "https://github.com/kiln/kiln"
